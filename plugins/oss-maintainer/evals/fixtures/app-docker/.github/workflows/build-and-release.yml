name: Build and Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Also push the latest tag"
        default: "false"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: example/app:${{ github.ref_name }}
